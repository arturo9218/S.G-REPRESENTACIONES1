<div class="shell shell--dark">
  <aside class="shell__sidebar" aria-label="Navegación principal">
    <div class="shell__sidebar-brand">
      <div class="shell__sidebar-logo">AR</div>
      <span class="shell__sidebar-title">AR Monitoreo</span>
    </div>
    <nav class="shell__nav shell__nav--labeled">
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'inicio'"
        [attr.aria-current]="shellRoute === 'inicio' ? 'page' : null"
        (click)="nav('inicio')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Inicio</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'devices'"
        [attr.aria-current]="shellRoute === 'devices' ? 'page' : null"
        (click)="nav('devices')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
        </svg>
        <span>Dispositivos</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'equipment'"
        [attr.aria-current]="shellRoute === 'equipment' ? 'page' : null"
        (click)="nav('equipment')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        <span>Ficha equipo</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'alerts'"
        [attr.aria-current]="shellRoute === 'alerts' ? 'page' : null"
        (click)="nav('alerts')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span>Alertas</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'ayuda'"
        [attr.aria-current]="shellRoute === 'ayuda' ? 'page' : null"
        (click)="nav('ayuda')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <span>Ayuda</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'herramientas'"
        [attr.aria-current]="shellRoute === 'herramientas' ? 'page' : null"
        (click)="nav('herramientas')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
        <span>Herramientas</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'comunidad'"
        [attr.aria-current]="shellRoute === 'comunidad' ? 'page' : null"
        (click)="nav('comunidad')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span>Comunidad</span>
        <span
          class="shell__nav-badge"
          *ngIf="chatUnreadTotal > 0"
          [attr.aria-label]="chatUnreadTotal + ' mensajes sin leer'"
        >🔔{{ chatUnreadTotal > 9 ? '9+' : chatUnreadTotal }}</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'presupuestos'"
        [attr.aria-current]="shellRoute === 'presupuestos' ? 'page' : null"
        (click)="nav('presupuestos')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
        </svg>
        <span>Presupuestos</span>
      </button>
      <button
        type="button"
        class="shell__nav-item"
        [class.shell__nav-item--active]="shellRoute === 'settings'"
        [attr.aria-current]="shellRoute === 'settings' ? 'page' : null"
        (click)="nav('settings')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
        <span>Configuración</span>
      </button>
    </nav>
    <button
      type="button"
      class="shell__nav-btn shell__nav-btn--bottom"
      title="Cerrar sesión"
      aria-label="Cerrar sesión"
      (click)="logoutClick.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </button>
  </aside>

  <div class="shell__main">
    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__brand-mark">AR</span>
        <span class="topbar__brand-text">AR Monitoreo</span>
        <span
          class="topbar__admin-pill"
          *ngIf="isAdminView"
          title="Estás viendo equipos de todas las cuentas"
        >Admin</span>
      </div>
      <div class="topbar__search-wrap">
        <svg class="topbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="search"
          class="topbar__search"
          placeholder="Buscar equipo…"
          aria-label="Buscar equipo por nombre, ubicación o ID"
          [(ngModel)]="searchQuery"
          [disabled]="!hasAnyEquipment"
        />
      </div>
      <div class="topbar__right">
        <button type="button" class="btn btn--ghost" aria-label="Cerrar sesión" (click)="logoutClick.emit()">Cerrar sesión</button>
        <button
          type="button"
          class="topbar__icon-btn topbar__icon-btn--alerts"
          aria-label="Reiniciar contador de alarmas"
          title="Alarmas acumuladas (click para reiniciar)"
          (click)="resetAlarms.emit()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="topbar__badge" *ngIf="summaryAlarmEvents > 0">{{ summaryAlarmEvents }}</span>
        </button>
        <button
          type="button"
          class="topbar__icon-btn"
          aria-label="Ayuda y manuales"
          title="Ayuda y manuales"
          (click)="nav('ayuda')"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div class="topbar__avatar" [attr.title]="email ?? ''">{{ userInitial }}</div>
      </div>
    </header>

    <div class="topbar-sub" *ngIf="showLastDataBar" role="status">
      <span class="topbar-sub__text">
        Última lectura en datos: <strong>{{ lastDataRefreshLabel }}</strong>
      </span>
    </div>

    <ng-content></ng-content>
  </div>
  <nav class="mobile-nav" *ngIf="hasShellContent" aria-label="Navegación inferior">
      <button
        type="button"
        class="mobile-nav__btn"
        [class.mobile-nav__btn--active]="shellRoute === 'inicio'"
        (click)="nav('inicio')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Inicio</span>
      </button>
      <button
        type="button"
        class="mobile-nav__btn"
        [class.mobile-nav__btn--active]="shellRoute === 'devices'"
        (click)="nav('devices')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
        </svg>
        <span>Equipos</span>
      </button>
      <button
        type="button"
        class="mobile-nav__btn"
        [class.mobile-nav__btn--active]="shellRoute === 'alerts'"
        (click)="nav('alerts')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span>Alertas</span>
      </button>
      <button
        type="button"
        class="mobile-nav__btn"
        [class.mobile-nav__btn--active]="shellRoute === 'ayuda'"
        (click)="nav('ayuda')"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <span>Ayuda</span>
      </button>
      <button
        type="button"
        class="mobile-nav__btn"
        [class.mobile-nav__btn--active]="mobileNavMoreActive() || mobileNavMoreOpen"
        [attr.aria-expanded]="mobileNavMoreOpen"
        aria-controls="mobile-nav-more"
        (click)="toggleMobileMore.emit()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="1" /><circle cx="12" cy="5" r="1" /><circle cx="12" cy="19" r="1" />
        </svg>
        <span>Más</span>
        <span
          class="mobile-nav__badge"
          *ngIf="chatUnreadTotal > 0"
          [attr.aria-label]="chatUnreadTotal + ' mensajes sin leer'"
        >{{ chatUnreadTotal > 9 ? '9+' : chatUnreadTotal }}</span>
      </button>
    </nav>

    <div
      class="mobile-nav-more"
      id="mobile-nav-more"
      *ngIf="mobileNavMoreOpen && hasShellContent"
      role="dialog"
      aria-label="Más secciones"
    >
      <button type="button" class="mobile-nav-more__backdrop" aria-label="Cerrar menú" (click)="closeMobileMore.emit()"></button>
      <div class="mobile-nav-more__sheet">
        <p class="mobile-nav-more__title">Más secciones</p>
        <button type="button" class="mobile-nav-more__item" (click)="nav('equipment')">
          Ficha equipo
        </button>
        <button type="button" class="mobile-nav-more__item" (click)="nav('herramientas')">
          Herramientas
        </button>
        <button type="button" class="mobile-nav-more__item" (click)="nav('comunidad')">
          Comunidad
          <span class="mobile-nav-more__badge" *ngIf="chatUnreadTotal > 0">{{ chatUnreadTotal > 9 ? '9+' : chatUnreadTotal }}</span>
        </button>
        <button type="button" class="mobile-nav-more__item" (click)="nav('presupuestos')">
          Presupuestos
        </button>
        <button type="button" class="mobile-nav-more__item" (click)="nav('settings')">
          Ajustes
        </button>
      </div>
    </div>
</div>
