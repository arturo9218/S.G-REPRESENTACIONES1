<div class="app-offline-banner" *ngIf="!online" role="alert">
  <span class="app-offline-banner__text">
    Sin conexión: las lecturas pueden dejar de actualizarse hasta que vuelva internet.
  </span>
  <button type="button" class="app-offline-banner__btn" (click)="reloadApp()">Reintentar</button>
</div>
<div class="app-update-banner" *ngIf="updateAvailable" role="status">
  <span class="app-update-banner__text">
    Hay una versión nueva (avisamos con un tono breve). Actualizá para ver los últimos cambios. Si ya diste permiso de notificaciones, también verás un aviso del sistema.
  </span>
  <div class="app-update-banner__actions">
    <button type="button" class="app-update-banner__btn app-update-banner__btn--primary" (click)="activateNewVersion()">
      Actualizar ahora
    </button>
    <button type="button" class="app-update-banner__btn" (click)="dismissUpdatePrompt()">Más tarde</button>
  </div>
</div>
<div
  class="app-toast"
  *ngIf="toast as t"
  [class.app-toast--success]="t.kind === 'success'"
  [class.app-toast--error]="t.kind === 'error'"
  role="status"
  aria-live="polite"
>
  <span class="app-toast__text">{{ t.text }}</span>
  <button type="button" class="app-toast__close" (click)="dismissToast()" aria-label="Cerrar aviso">×</button>
</div>
<router-outlet></router-outlet>
